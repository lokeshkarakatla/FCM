<div style="overflow-y: hidden; overflow-x: hidden;">
  <div class="NewHeader">
    <h1 style="color: white; font-size: 18px; margin: 0; font-weight: 500;" mat-dialog-title>
      <span *ngIf="!data">Add</span><span *ngIf="data">Edit</span> Agenda
    </h1>
  </div>

  <div mat-dialog-content style="overflow: hidden; padding-bottom: 0px; margin-top: -15px;">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3 mt-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Subject : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <input type="text" class="form-control" style="border-radius: 4px;" placeholder="Enter Subject"
                 [(ngModel)]="name" name="agendaSubject" autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Description : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <textarea class="form-control" rows="3" style="border-radius: 4px; height: auto;"
                    placeholder="Enter Description" [(ngModel)]="description" name="agendaDescription">
          </textarea>
        </div>
      </div>

    </form>
  </div>

  <mat-dialog-actions align="end" style="margin-top: 15px; padding: 10px 0 0 0;">
    <button mat-raised-button class="btn-default me-2" (click)="close()">
      <mat-icon>cancel</mat-icon> Cancel
    </button>
    <button mat-raised-button color="primary" (click)="save()">
      <mat-icon>save</mat-icon> Save
    </button>
  </mat-dialog-actions>
</div>
