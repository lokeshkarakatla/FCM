<div class="custom-modal-wrapper">
  <div class="modal-header-custom">
    <h2 class="modal-title-text">
      <span *ngIf="!data">Add</span><span *ngIf="data">Edit</span> Agenda
    </h2>
    <button type="button" class="modal-close-icon btn btn-link p-0 text-white" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="modal-body-custom">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Subject : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" style="border-radius: 4px;" placeholder="Enter Subject"
                 [(ngModel)]="name" name="agendaSubject" autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Description : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <textarea class="form-control" rows="3" style="border-radius: 4px; height: auto;"
                    placeholder="Enter Description" [(ngModel)]="description" name="agendaDescription">
          </textarea>
        </div>
      </div>

    </form>
  </div>

  <mat-dialog-actions align="end" class="modal-actions-custom">
    <button mat-raised-button class="btn-default" (click)="close()">
      <mat-icon class="btn-icon">cancel</mat-icon><span class="btn-label">Cancel</span>
    </button>
    <button mat-raised-button color="primary" (click)="save()">
      <mat-icon class="btn-icon">save</mat-icon><span class="btn-label">Save</span>
    </button>
  </mat-dialog-actions>
</div>
