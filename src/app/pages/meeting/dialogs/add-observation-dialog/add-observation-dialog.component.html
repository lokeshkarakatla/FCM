<div class="custom-modal-wrapper">
  <div class="modal-header-custom">
    <h2 class="modal-title-text">
      <span *ngIf="!data">Add</span><span *ngIf="data">Edit</span> Complaint
    </h2>
    <button type="button" class="modal-close-icon btn btn-link p-0 text-white" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="modal-body-custom">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Category : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <mat-select class="form-control bac" [(ngModel)]="category" name="category" placeholder="Select Category">
            <mat-option value="Quality">Quality</mat-option>
            <mat-option value="Production Operations">Production Operations</mat-option>
            <mat-option value="Quality Assurance">Quality Assurance</mat-option>
            <mat-option value="Laboratory">Laboratory</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Function : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <mat-select class="form-control bac" [(ngModel)]="functionName" name="functionName" placeholder="Select Function">
            <mat-option value="Function1">Function1</mat-option>
            <mat-option value="Assembly Line">Assembly Line</mat-option>
            <mat-option value="Raw Material Inspection">Raw Material Inspection</mat-option>
            <mat-option value="Packaging Quality">Packaging Quality</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Serial / Ref : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control bac" style="border-radius: 4px;" placeholder="e.g. NO-789"
                 [(ngModel)]="serial" name="serial" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Subject : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control bac" style="border-radius: 4px;" placeholder="Enter Subject"
                 [(ngModel)]="subject" name="subject" autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Description : </b>
        </label>
        <div class="col-sm-9">
          <textarea class="form-control" rows="3" style="border-radius: 4px; height: auto;"
                    placeholder="Enter Description" [(ngModel)]="description" name="description"></textarea>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Chronic : </b>
        </label>
        <div class="col-sm-9">
          <mat-checkbox [(ngModel)]="chronic" name="chronic"></mat-checkbox>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Demerit : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="number" class="form-control bac" style="border-radius: 4px;" placeholder="Enter Demerit"
                 [(ngModel)]="demerit" name="demerit" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Date Initiated : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control bac" style="border-radius: 4px;"
                 [(ngModel)]="dateInitiated" name="dateInitiated" />
        </div>
      </div>

    </form>
  </div>

  <mat-dialog-actions align="end" class="modal-actions-custom">
    <button mat-raised-button class="btn-default" (click)="close()">
      <mat-icon class="btn-icon">cancel</mat-icon><span class="btn-label">Cancel</span>
    </button>
    <button mat-raised-button color="primary" (click)="save()">
      <mat-icon class="btn-icon">save</mat-icon><span class="btn-label">Save</span>
    </button>
  </mat-dialog-actions>
</div>
