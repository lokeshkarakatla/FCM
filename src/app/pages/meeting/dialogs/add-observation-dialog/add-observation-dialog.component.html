<div style="overflow-y: hidden; overflow-x: hidden;">
  <div class="NewHeader">
    <h1 style="color: white; font-size: 18px; margin: 0; font-weight: 500;" mat-dialog-title>
      <span *ngIf="!data">Add</span><span *ngIf="data">Edit</span> Observation
    </h1>
  </div>

  <div mat-dialog-content style="overflow: auto; max-height: 65vh; padding-bottom: 0px; margin-top: -15px;">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3 mt-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Category : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <mat-select class="form-control bac" [(ngModel)]="category" name="category" placeholder="Select Category">
            <mat-option value="Quality">Quality</mat-option>
            <mat-option value="Production Operations">Production Operations</mat-option>
            <mat-option value="Quality Assurance">Quality Assurance</mat-option>
            <mat-option value="Laboratory">Laboratory</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Function : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <mat-select class="form-control bac" [(ngModel)]="functionName" name="functionName" placeholder="Select Function">
            <mat-option value="Function1">Function1</mat-option>
            <mat-option value="Assembly Line">Assembly Line</mat-option>
            <mat-option value="Raw Material Inspection">Raw Material Inspection</mat-option>
            <mat-option value="Packaging Quality">Packaging Quality</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Serial / Ref : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <input type="text" class="form-control bac" style="border-radius: 4px;" placeholder="e.g. NO-789"
                 [(ngModel)]="serial" name="serial" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Subject : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <input type="text" class="form-control bac" style="border-radius: 4px;" placeholder="Enter Subject"
                 [(ngModel)]="subject" name="subject" autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Description : </b>
        </label>
        <div class="col-sm-8">
          <textarea class="form-control" rows="3" style="border-radius: 4px; height: auto;"
                    placeholder="Enter Description" [(ngModel)]="description" name="description"></textarea>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Chronic : </b>
        </label>
        <div class="col-sm-8">
          <mat-checkbox [(ngModel)]="chronic" name="chronic"></mat-checkbox>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Demerit : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <input type="number" class="form-control bac" style="border-radius: 4px;" placeholder="Enter Demerit"
                 [(ngModel)]="demerit" name="demerit" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-4 control-label">
          <b style="color: black; font-weight: 650;">Date Initiated : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-8">
          <input type="date" class="form-control bac" style="border-radius: 4px;"
                 [(ngModel)]="dateInitiated" name="dateInitiated" />
        </div>
      </div>

    </form>
  </div>

  <mat-dialog-actions align="end" style="margin-top: 15px; padding: 10px 0 0 0;">
    <button mat-raised-button class="btn-default me-2" (click)="close()">
      <mat-icon>cancel</mat-icon> Cancel
    </button>
    <button mat-raised-button color="primary" (click)="save()">
      <mat-icon>save</mat-icon> Save
    </button>
  </mat-dialog-actions>
</div>
