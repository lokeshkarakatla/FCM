<div class="col-lg-12" style="overflow: hidden; ">
  <!-- <div>
    <h2 style="font-size: 25px; font-weight: bold">Complaints</h2>
    <hr />
  </div> -->
  <div class="d-flex justify-content-end p-2" style="margin-right: -7px;">


    <button mat-raised-button color="primary" class="add-meeting-btn" (click)="gotoMeeting(null)">
      <mat-icon class="btn-icon">person_add</mat-icon><span class="btn-label">Add Meeting</span>
    </button>
  </div>

  <!-- Table -->

  <div class="col-sm-12" style="margin-top: 10px;margin-left: -6px;">
    <div class="table-responsive" id="grid-table-container">
      <table class="table table-bordered table-hover align-middle">
        <thead class="tbl-head">
          <tr>
            <th class="text-center" style="white-space: nowrap">Meeting Ref</th>
            <th style="white-space: nowrap">Date</th>
            <th style="white-space: nowrap">Time</th>
            <th style="white-space: nowrap">Duration</th>
            <th class="text-center">Complaints</th>
            <th class="text-center">CAPA</th>
            <th class="text-center">Attendance</th>
            <th class="text-center">Agenda</th>
            <th class="text-center">Status</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data">

            <!-- Meeting Ref (Blue clickable link to Meeting Execution Inner Screen) -->
            <td class="text-center">
              <a (click)="openMeetingInnerScreen(item)"
                style="color: #0284c7; cursor: pointer; font-weight: 700; text-decoration: underline;">
                {{ item.meetingRef }}
              </a>
            </td>

            <td>{{ item.date }}</td>
            <td>{{ item.time }}</td>
            <td>{{ item.duration }}</td>

            <!-- Complaints Count -->
            <td class="text-center">
              <a (click)="openMeetingInnerScreen(item, 'observations')"
                style="color: #0284c7; cursor: pointer; text-decoration: underline; font-weight: 700;">
                {{ item.complaints }}
              </a>
            </td>

            <!-- CAPA (Click to open dedicated CAPA dialog) -->
            <td class="text-center">
              <a (click)="openCapaDialog(item)"
                style="color: #0284c7; cursor: pointer; text-decoration: underline; font-weight: 700;">
                {{ item.capa }}
              </a>
            </td>

            <!-- Attendance (Click to open Attendance modal matching Snapshot 1) -->
            <td class="text-center" (click)="Attendancecount(item)">
              <a style="color: #0284c7; cursor: pointer; text-decoration: underline; font-weight: 700;">
                {{ item.attendance }}
              </a>
            </td>

            <!-- Agenda (Click to open Agenda modal) -->
            <td class="agenda-cell center-cell text-center pointer" (click)="openAgendaDialog(item)">
              <a style="color: #0284c7; cursor: pointer; text-decoration: underline; font-weight: 700;">
                {{ item.agenda }}
              </a>
            </td>

            <!-- Status Badge -->
            <td class="text-center">
              <span *ngIf="isMeetingClosed(item)" class="badge bg-secondary">Closed</span>
              <span *ngIf="!isMeetingClosed(item)" class="badge bg-success">Open</span>
            </td>

            <td class="text-center text-nowrap">
              <a matTooltip="Edit Meeting" (click)="openMeetingInnerScreen(item)"
                style="cursor: pointer; margin-right: 12px; color: #0284c7;">
                <i class="fa fa-edit" style="font-size: 16px;"></i>
              </a>
              <a matTooltip="Delete Meeting" (click)="deleteConfirmation()" style="cursor: pointer;">
                <i class="fa fa-trash red" style="font-size: 16px;"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- Pagination -->
      <mat-paginator [length]="totalSize" [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 50, 100]" showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>

  <!-- Table -->
</div>
