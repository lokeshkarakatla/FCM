<div class="custom-modal-wrapper">
  <!-- Header -->
  <div class="modal-header-custom">
    <h2 class="modal-title-text">
      {{ data ? 'Update' : 'Add' }} CAPA
    </h2>
    <button type="button" class="modal-close-icon btn btn-link p-0 text-white" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body Content -->
  <div mat-dialog-content class="modal-body-custom">
    <form class="form-horizontal">

      <!-- Complaint -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Complaint : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <mat-select placeholder="Select Complaint" class="form-control bac" [(ngModel)]="title" name="complaint">
            <mat-option *ngFor="let c of complaintsList" [value]="c">
              {{ c }}
            </mat-option>
          </mat-select>
        </div>
      </div>

      <!-- Role -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Role : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <mat-select placeholder="Select Role" class="form-control bac" [(ngModel)]="role" name="role">
            <mat-option *ngFor="let r of rolesList" [value]="r">{{ r }}</mat-option>
          </mat-select>
        </div>
      </div>

      <!-- Department -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Department : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <mat-select placeholder="Select Department" class="form-control bac" [(ngModel)]="department" name="department">
            <mat-option *ngFor="let d of departmentsList" [value]="d">{{ d }}</mat-option>
          </mat-select>
        </div>
      </div>

      <!-- Subject -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Subject : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control bac" placeholder="Enter Subject" [(ngModel)]="issue" name="subject" />
        </div>
      </div>

      <!-- Target Date -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Target Date : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control bac" [(ngModel)]="date" name="targetDate" />
        </div>
      </div>

      <!-- ETA Date -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">ETA Date :</b>
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control bac" [(ngModel)]="eta" name="etaDate" />
        </div>
      </div>

      <!-- Completed Date -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Completed Date :</b>
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control bac" [(ngModel)]="completedDate" name="completedDate" />
        </div>
      </div>

      <!-- Done -->
      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          <b style="color: #1e293b; font-weight: 600;">Done :</b>
        </label>
        <div class="col-sm-9 d-flex align-items-center">
          <mat-checkbox [(ngModel)]="done" name="done" (change)="onDoneChange($event.checked)" color="primary">
            <span style="font-weight: 500; font-size: 14px; color: #1e293b;">Mark as Done / Resolved</span>
          </mat-checkbox>
        </div>
      </div>

      <!-- Description -->
      <div class="row align-items-start mb-3">
        <label class="col-sm-3 control-label pt-2">
          <b style="color: #1e293b; font-weight: 600;">Description : <span class="text-danger">*</span></b>
        </label>
        <div class="col-sm-9">
          <textarea class="form-control bac" rows="3" [(ngModel)]="details" name="description"
            placeholder="Enter Description"></textarea>
        </div>
      </div>

    </form>
  </div>

  <!-- Actions -->
  <mat-dialog-actions align="end" class="modal-actions-custom">
    <button mat-raised-button class="btn-default" (click)="close()">
      <mat-icon class="btn-icon">cancel</mat-icon><span class="btn-label">Close</span>
    </button>
    <button mat-raised-button color="primary" (click)="save()">
      <mat-icon class="btn-icon">save</mat-icon><span class="btn-label">{{ data ? 'Update' : 'Save' }}</span>
    </button>
  </mat-dialog-actions>
</div>
