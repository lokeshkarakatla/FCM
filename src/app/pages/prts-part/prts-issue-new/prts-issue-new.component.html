<div class="page-container" >
  <div class="page-header">
    <h2>New Issue</h2>
    <p>Create A New PRTS Issue For Tracking And Resolution</p>
  </div>

  <div class="form-layout">

    <div class="form-column-main">

      <div class="form-card">
        <h3>Basic Information</h3>
        <div class="form-grid">
          <div class="form-group full-span">
            <label>Request Type</label>
            <mat-radio-group class="radio-group">
              <mat-radio-button value="1" [checked]="true">PSR</mat-radio-button>
              <mat-radio-button value="2">One Pager</mat-radio-button>
            </mat-radio-group>
          </div>
          <div class="form-group">
            <label>PRTS No.</label>
            <input type="text" class="form-control" placeholder="Enter PRTS No.">
          </div>
          <div class="form-group">
            <label>Assigned Date:</label>
            <input type="text" class="form-control" placeholder="Select Date">
          </div>
          <div class="form-group full-span important">
            <label class="add-member-label">Issue Title:</label>
            <input type="text" class="form-control" placeholder="Enter the title of the issue">
          </div>
          <div class="form-group full-span important">
            <label class="add-member-label">Issue Description:</label>
            <textarea class="form-control" rows="4" placeholder="Describe the issue in detail"></textarea>
          </div>
          <div class="form-group">
            <label>Source:</label>
            <input type="text" class="form-control" placeholder="Enter the source">
          </div>
          <div class="form-group">
            <label>Author:</label>
            <input type="text" value="Roshan" class="form-control" placeholder="Enter the author's name" readonly>
          </div>
          <div class="form-group full-span">
            <label>Author Department:</label>
            <mat-select class="form-control" [(value)]="selectedAuthorDept">
              <mat-option *ngFor="let dept of authorDepartments" [value]="dept">
                {{ dept }}
              </mat-option>
            </mat-select>
          </div>
        </div>
      </div>

      <div class="form-card">
        <h3>Project Information</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Model:</label>
            <mat-select class="form-control" [(value)]="selectedModel">
              <mat-option *ngFor="let model of models" [value]="model">
                {{ model }}
              </mat-option>
            </mat-select>
          </div>
          <div class="form-group">
            <label>Variant:</label>
            <mat-select class="form-control" [(value)]="selectedVariant">
              <mat-option *ngFor="let variant of variants" [value]="variant">
                {{ variant }}
              </mat-option>
            </mat-select>
          </div>
          <div class="form-group">
            <label>Issue Severity:</label>
            <mat-select class="form-control" [(value)]="selectedSeverity">
              <mat-option *ngFor="let severity of severities" [value]="severity">
                {{ severity }}
              </mat-option>
            </mat-select>
          </div>
          <div class="form-group">
            <label>Category:</label>
            <mat-select class="form-control" [(value)]="selectedCategory">
              <mat-option *ngFor="let category of categories" [value]="category">
                {{ category }}
              </mat-option>
            </mat-select>
          </div>
          <div class="form-group">
            <mat-checkbox class="report-issue-checkbox" (change)="repeted($event)">Repeat Issue</mat-checkbox>
          </div>

          <div class="form-group full-span" *ngIf="isRepeted">
            <label>Enter PRTS Reference :</label>

            <mat-select class="form-control" placeholder="Enter PRTS Reference" [(value)]="selectedMachine">

              <!-- 🔍 Search -->
              <mat-option>
                <ngx-mat-select-search [formControl]="searchCtrl" placeholderLabel="Search"
                  noEntriesFoundLabel="No results found">
                </ngx-mat-select-search>
              </mat-option>

              <!-- Options -->
              <mat-option *ngFor="let machine of filteredMachines" [value]="machine.value">
                {{ machine.viewValue }}
              </mat-option>

            </mat-select>
          </div>
        </div>
      </div>

      <div class="form-card">
        <h3>Assignment Details</h3>

        <!-- Labels -->
        <div class="assignment-header assignment-grid">
          <label class="assignment-label">Assigned to:</label>
          <label class="assignment-label">Containment Assigned:</label>
        </div>

        <!-- Inputs -->
        <div class="assignment-row">
          <mat-select class="form-control" placeholder="Assigned User" [(value)]="selectedAssignedUser">
            <mat-option *ngFor="let user of assignedUsers" [value]="user">
              {{ user }}
            </mat-option>
          </mat-select>

          <mat-select class="form-control" placeholder="Containment User" [(value)]="selectedContainmentUser">
            <mat-option *ngFor="let user of containmentUsers" [value]="user">
              {{ user }}
            </mat-option>
          </mat-select>
        </div>
      </div>
    </div>

    <div class="form-column-side">
      <div class="form-card">
        <h3>5W2H Analysis</h3>
        <div class="analysis-grid">
          <div class="form-group">
            <label>1. What:</label>
            <textarea class="form-control" rows="3" placeholder="What is the physical failure symptom & Diagnostic Trouble Code (DTC)?"></textarea>
          </div>
          <div class="form-group">
            <label>2. Where:</label>
            <textarea class="form-control" rows="3" placeholder="Where did it occur? (Plant gate, dealership, chassis/powertrain location)"></textarea>
          </div>
          <div class="form-group">
            <label>3. When:</label>
            <textarea class="form-control" rows="3" placeholder="When did it happen? (Mileage/km, date, ambient temperature)"></textarea>
          </div>
          <div class="form-group">
            <label>4. Who:</label>
            <textarea class="form-control" rows="3" placeholder="Who detected it? (PDI inspector, dealer technician, customer)"></textarea>
          </div>
          <div class="form-group">
            <label>5. Why:</label>
            <textarea class="form-control" rows="3" placeholder="Why is it abnormal? (Engineering standard or tolerance violated)"></textarea>
          </div>
          <div class="form-group">
            <label>6. How:</label>
            <textarea class="form-control" rows="3" placeholder="How did the failure manifest? (Warning light, NVH noise/vibration, fluid leak)"></textarea>
          </div>
          <div class="form-group">
            <label>7. How Much / Many:</label>
            <textarea class="form-control" rows="3" placeholder="How many units affected? (Batch size, estimated warranty claim cost)"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="action-buttons" style="margin-top: -45px;">
    <button mat-raised-button class="ms-2 add-dark-hover btn-default" (click)="close()"
      style="background-color: lightgray; color: red;margin-right: 8px;">
      <mat-icon>cancel</mat-icon>
      Close
    </button>
    <button mat-raised-button type="button" class="save" color="primary" (click)="save()" style="margin-right: 5px;">
      <mat-icon>save</mat-icon> Save
    </button>
  </div>
</div>
