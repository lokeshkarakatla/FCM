<div class="section-wrapper mt-3">
  <div class="container-fluid px-4">

    <!-- Parts Table (part number, part name, remarks, actions) -->
    <div class="parts-section">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="table-title">Dispatched Parts</h5>
        <button mat-raised-button color="primary" class="btn-sm" (click)="openDispatchDialog()">
          <mat-icon class="btn-icon">add</mat-icon> Add Part
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="tbl-head">
            <tr>
              <th style="width: 140px;">Part No</th>
              <th style="width: 280px;">Part Name</th>
              <th>Remarks</th>
              <th class="text-center" style="width: 100px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of parts">
              <td class="fw-semibold">{{ p.partNo }}</td>
              <td>{{ p.partName }}</td>
              <td>{{ p.remarks || '-' }}</td>
              <td class="text-center">
                <a matTooltip="Edit" class="action-btn-link" (click)="openDispatchDialog(p)"><i class="fa fa-edit"></i></a>
                <a matTooltip="Delete" class="action-btn-link" (click)="deletePart(p)"><i class="fa fa-trash red"></i></a>
              </td>
            </tr>
            <tr *ngIf="parts.length === 0">
              <td colspan="4" class="text-center text-muted py-3">No dispatched parts added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Consignment / Dispatch Information (Informational Labels shown above Dispatch Remarks) -->
    <div class="dispatch-info-card mt-4">
      <div class="info-card-header">
        <div class="info-title">
          <mat-icon class="info-icon">local_shipping</mat-icon>
          <span>Consignment Information</span>
        </div>
      </div>

      <!-- Editable Consignment Information Inputs -->
      <div class="row g-3 p-3 info-card-body">
        <div class="col-md-3 col-sm-6">
          <div class="info-group">
            <label class="info-label" for="fromDealer">From (Dealer):</label>
            <input type="text" id="fromDealer" class="form-control" placeholder="Enter From (Dealer)" [(ngModel)]="fromDealer">
          </div>
        </div>
        <div class="col-md-3 col-sm-6">
          <div class="info-group">
            <label class="info-label" for="toFactory">To (Factory):</label>
            <input type="text" id="toFactory" class="form-control" placeholder="Enter To (Factory)" [(ngModel)]="toFactory">
          </div>
        </div>
        <div class="col-md-3 col-sm-6">
          <div class="info-group">
            <label class="info-label" for="trackingNo">Tracking No:</label>
            <input type="text" id="trackingNo" class="form-control" placeholder="Enter Tracking No" [(ngModel)]="trackingNo">
          </div>
        </div>
        <div class="col-md-3 col-sm-6">
          <div class="info-group">
            <label class="info-label" for="dispatchDate">Dispatch Date:</label>
            <input type="date" id="dispatchDate" class="form-control" [(ngModel)]="dispatchDate">
          </div>
        </div>
      </div>
    </div>

    <!-- Dispatch Remarks -->
    <div class="row mt-4">
      <div class="col-12">
        <label class="form-label"><b>Dispatch Remarks:</b></label>
        <textarea rows="3" class="form-control" placeholder="Additional dispatch notes..." [(ngModel)]="remarks"></textarea>
      </div>
      <div class="col-12 d-flex justify-content-end mt-3">
        <button mat-raised-button color="primary" class="save-btn" (click)="save()">
          <mat-icon class="btn-icon">save</mat-icon> Save
        </button>
      </div>
    </div>
  </div>
</div>
