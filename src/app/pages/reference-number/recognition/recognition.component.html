<div class="section-wrapper mt-3">
  <div class="container-fluid px-4">
    <!-- Simple Recognition Block (per client request: no grid, single clean block with department, personnel, compliments) -->
    <div class="form-card mt-2">
      <div class="row g-4">
        <div class="col-md-4">
          <label class="form-label"><b>Department:</b></label>
          <input type="text" class="form-control" placeholder="e.g. Quality Assurance & Manufacturing" [(ngModel)]="department">
        </div>
        <div class="col-md-5">
          <label class="form-label"><b>Personnel / Team Members Recognized:</b></label>
          <input type="text" class="form-control" placeholder="e.g. Ravi Kumar, Priya Sharma, Arun Verma" [(ngModel)]="personnel">
        </div>
        <div class="col-md-3">
          <label class="form-label"><b>Recognition Date:</b></label>
          <input type="date" class="form-control" [(ngModel)]="recognitionDate">
        </div>

        <div class="col-md-12">
          <label class="form-label"><b>Citation / Achievement Category:</b></label>
          <input type="text" class="form-control" placeholder="e.g. Swift Containment Execution & Root Cause Eradication" [(ngModel)]="achievementCategory">
        </div>

        <div class="col-12">
          <label class="form-label"><b>Compliments & Appreciation Notes:</b></label>
          <textarea rows="4" class="form-control" placeholder="Write compliments, commendation notes, or leadership remarks recognizing their contribution..." [(ngModel)]="compliments"></textarea>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4 mb-4">
      <button mat-raised-button color="primary" class="save-btn" (click)="save()">
        <mat-icon class="btn-icon">save</mat-icon> Save
      </button>
    </div>
  </div>
</div>
