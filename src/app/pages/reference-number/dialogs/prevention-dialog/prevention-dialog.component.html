<div class="custom-modal-wrapper">
  <div class="modal-header-custom">
    <h2 class="modal-title-text">
      {{ data ? 'Edit Preventive Measure' : 'Add Preventive Measure' }}
    </h2>
    <button type="button" class="modal-close-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="modal-body-custom">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Preventive Measure <span class="text-danger">*</span> :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. Implement Poka-Yoke fixture on assembly station"
                 [(ngModel)]="measure" name="measureText" required autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Type :
        </label>
        <div class="col-sm-9">
          <mat-select class="form-control" [(ngModel)]="type" name="prevType">
            <mat-option value="Process">Process</mat-option>
            <mat-option value="Tooling">Tooling</mat-option>
            <mat-option value="Design">Design</mat-option>
            <mat-option value="Training">Training</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Department & Owner :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. Process Engineering / Tooling Lead"
                 [(ngModel)]="owner" name="ownerName" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Target Date :
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control" [(ngModel)]="targetDate" name="prevTarget" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Completion Date :
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control" [(ngModel)]="completionDate" name="prevComp" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Status :
        </label>
        <div class="col-sm-9">
          <mat-select class="form-control" [(ngModel)]="status" name="prevStatus">
            <mat-option value="Implemented">Implemented</mat-option>
            <mat-option value="In Progress">In Progress</mat-option>
            <mat-option value="Pending">Pending</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Done :
        </label>
        <div class="col-sm-9">
          <mat-checkbox [(ngModel)]="done" name="prevDone" color="primary">
            Mark as completed
          </mat-checkbox>
        </div>
      </div>

    </form>
  </div>

  <div class="modal-footer-custom">
    <button mat-button class="btn-cancel-modal" (click)="close()">
      <mat-icon>cancel</mat-icon> Cancel
    </button>
    <button mat-raised-button class="btn-save-modal" (click)="save()" [disabled]="!measure">
      <mat-icon>save</mat-icon> {{ data ? 'Update' : 'Save' }}
    </button>
  </div>
</div>
