<div class="custom-modal-wrapper">
  <div class="modal-header-custom">
    <h2 class="modal-title-text">
      {{ data ? 'Edit Service' : 'Add Service Provided' }}
    </h2>
    <button type="button" class="modal-close-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="modal-body-custom">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Service ID <span class="text-danger">*</span> :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. SVC-1082"
                 [(ngModel)]="serviceId" name="serviceId" required autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Description <span class="text-danger">*</span> :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. In-field harness connector replacement"
                 [(ngModel)]="description" name="description" required />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Service Date :
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control" [(ngModel)]="date" name="serviceDate" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Technician :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. Rajesh Kumar (Senior Field Tech)"
                 [(ngModel)]="technician" name="technician" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Status :
        </label>
        <div class="col-sm-9">
          <mat-select class="form-control" [(ngModel)]="status" name="svcStatus">
            <mat-option value="Completed">Completed</mat-option>
            <mat-option value="In Progress">In Progress</mat-option>
            <mat-option value="Scheduled">Scheduled</mat-option>
          </mat-select>
        </div>
      </div>

    </form>
  </div>

  <div class="modal-footer-custom">
    <button mat-button class="btn-cancel-modal" (click)="close()">
      <mat-icon>cancel</mat-icon> Cancel
    </button>
    <button mat-raised-button class="btn-save-modal" (click)="save()" [disabled]="!serviceId || !description">
      <mat-icon>save</mat-icon> {{ data ? 'Update' : 'Save' }}
    </button>
  </div>
</div>
