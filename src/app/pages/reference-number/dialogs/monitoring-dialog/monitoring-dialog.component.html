<div class="custom-modal-wrapper">
  <div class="modal-header-custom">
    <h2 class="modal-title-text">
      {{ data ? 'Edit Monitoring Record' : 'Add Monitoring Record' }}
    </h2>
    <button type="button" class="modal-close-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="modal-body-custom">
    <form class="form-horizontal">

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Verification Date <span class="text-danger">*</span> :
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control" [(ngModel)]="date" name="monDate" required autofocus />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Validation Summary <span class="text-danger">*</span> :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. Line B defect rate below 0.1% for 48 hours"
                 [(ngModel)]="summary" name="valSummary" required />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Evidence Document :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. SPC_RunChart_LineB.pdf"
                 [(ngModel)]="documentName" name="docName" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Monitored By :
        </label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="e.g. Quality Assurance / QA Auditor"
                 [(ngModel)]="monitoredBy" name="monBy" />
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label class="col-sm-3 control-label">
          Status :
        </label>
        <div class="col-sm-9">
          <mat-select class="form-control" [(ngModel)]="status" name="monStatus">
            <mat-option value="Pass">Pass</mat-option>
            <mat-option value="Fail">Fail</mat-option>
          </mat-select>
        </div>
      </div>

    </form>
  </div>

  <div class="modal-footer-custom">
    <button mat-button class="btn-cancel-modal" (click)="close()">
      <mat-icon>cancel</mat-icon> Cancel
    </button>
    <button mat-raised-button class="btn-save-modal" (click)="save()" [disabled]="!summary">
      <mat-icon>save</mat-icon> {{ data ? 'Update' : 'Save' }}
    </button>
  </div>
</div>
