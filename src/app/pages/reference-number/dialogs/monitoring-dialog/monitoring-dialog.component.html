<div class="NewHeader">
  <h1 mat-dialog-title style="color: white; margin: 0; text-align: center;">
    {{ data ? 'Edit Monitoring Record' : 'Add Monitoring Record' }}
  </h1>
</div>

<form #monForm="ngForm" class="dialog-form" autocomplete="off">
  <div mat-dialog-content class="custom-dialog-content pt-2"
    style="padding: 20px 25px; background: white; max-height: 75vh; overflow-y: auto;">
    <div class="row" style="display: flex; align-items: stretch; flex-wrap: wrap;">

      <!-- ========================= LEFT COLUMN (FIELDS) ========================= -->
      <div class="col-sm-6" style="padding-right: 15px; display: flex; flex-direction: column; justify-content: space-between; min-width: 300px; flex: 1;">

        <!-- Verification Date * -->
        <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
          <div class="col-sm-4">
            <label class="control-label" style="font-weight: 500; font-size: 13px; margin: 0; white-space: nowrap;">
              Verification Date <span style="color: red;">*</span> :
            </label>
          </div>
          <div class="col-sm-8">
            <input type="date" name="monDate" [(ngModel)]="date" class="form-control" required autofocus
              style="width: 100%; height: 35px; background-color: #ffffff !important;" />
          </div>
        </div>

        <!-- Validation Summary * -->
        <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
          <div class="col-sm-4">
            <label class="control-label" style="font-weight: 500; font-size: 13px; margin: 0; white-space: nowrap;">
              Validation Summary <span style="color: red;">*</span> :
            </label>
          </div>
          <div class="col-sm-8">
            <input type="text" name="valSummary" [(ngModel)]="summary" class="form-control" required
              placeholder="e.g. Line B defect rate below 0.1% for 48 hours"
              style="width: 100%; height: 35px; background-color: #ffffff !important;" />
          </div>
        </div>

        <!-- Monitored By -->
        <div class="row" style="margin-bottom: 14px; display: flex; align-items: center;">
          <div class="col-sm-4">
            <label class="control-label" style="font-weight: 500; font-size: 13px; margin: 0; white-space: nowrap;">
              Monitored By :
            </label>
          </div>
          <div class="col-sm-8">
            <input type="text" name="monBy" [(ngModel)]="monitoredBy" class="form-control"
              placeholder="e.g. Quality Assurance / QA Auditor"
              style="width: 100%; height: 35px; background-color: #ffffff !important;" />
          </div>
        </div>

        <!-- Status -->
        <div class="row" style="margin-bottom: 0; display: flex; align-items: center;">
          <div class="col-sm-4">
            <label class="control-label" style="font-weight: 500; font-size: 13px; margin: 0; white-space: nowrap;">
              Status :
            </label>
          </div>
          <div class="col-sm-8">
            <mat-select name="monStatus" [(ngModel)]="status" class="form-control"
              style="width: 100%; height: 35px; line-height: 24px; background-color: #ffffff !important;">
              <mat-option value="Pass">Pass</mat-option>
              <mat-option value="Fail">Fail</mat-option>
            </mat-select>
          </div>
        </div>

      </div>

      <!-- ========================= RIGHT COLUMN (UPLOAD EVIDENCE DOCUMENT) ========================= -->
      <div class="col-sm-6" style="padding-left: 15px; display: flex; flex-direction: column; min-width: 300px; flex: 1;">

        <div style="margin-bottom: 10px; display: flex; align-items: center;">
          <label class="control-label"
            style="margin: 0; font-weight: 600; font-size: 13px; color: #1e293b; white-space: nowrap;">
            Evidence Document :
          </label>
        </div>

        <!-- Green dashed border upload dropzone container -->
        <div class="pdf-upload-dropzone"
          [class.dragging]="isDragging"
          (dragover)="$event.preventDefault(); isDragging = true;"
          (dragleave)="isDragging = false;"
          (drop)="onFileDropped($event)"
          style="border: 2px dashed #22c55e; border-radius: 8px; background-color: #fafbfc; flex: 1; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; transition: all 0.2s ease;">

          <mat-icon
            style="font-size: 38px; width: 38px; height: 38px; line-height: 38px; color: #475569; margin-bottom: 12px;">
            file_upload
          </mat-icon>

          <div style="font-size: 14px; color: #334155; font-weight: 500; margin-bottom: 14px;">
            Drag and drop files here
          </div>

          <button type="button" class="app-btn app-btn-primary" (click)="fileInput.click()"
            style="font-weight: 600; padding: 6px 22px; border-radius: 6px; font-size: 13px; background-color: #1976d2; color: white; border: none; cursor: pointer;">
            Browse Files
          </button>

          <input #fileInput type="file" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg" style="display: none;" />

          <!-- Selected or Existing Document info badge -->
          <div *ngIf="documentName"
            style="margin-top: 14px; padding: 6px 12px; background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: #0369a1; font-weight: 500;">
            <mat-icon style="font-size: 16px; width: 16px; height: 16px; color: #0284c7; line-height: 16px;">description</mat-icon>
            <span style="max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ documentName }}</span>
            <a style="cursor: pointer; color: #ef4444; margin-left: 4px; display: inline-flex; align-items: center;" (click)="removeDocument()" matTooltip="Remove document">
              <mat-icon style="font-size: 16px; width: 16px; height: 16px;">close</mat-icon>
            </a>
          </div>

        </div>

      </div>

    </div>
  </div>

  <mat-dialog-actions class="dialog-actions-right"
    style="padding: 15px 25px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #cbd5e1; margin-top: 0; background: white;">
    <button mat-raised-button type="button" (click)="close()" style="background-color: lightgray; color: red;">
      <mat-icon>cancel</mat-icon> Close
    </button>
    <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="!summary">
      <mat-icon>save</mat-icon> {{ data ? 'Update' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
