<div class="section-wrapper mt-3">
  <div class="container-fluid px-4">
    <div class="mt-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="table-title">Preventive Measures</h5>
        <button mat-raised-button color="primary" class="btn-sm" (click)="openMeasureDialog()">
          <mat-icon class="btn-icon">add</mat-icon> Add Measure
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="tbl-head">
            <tr>
              <th>Preventive Measure</th>
              <th>Type</th>
              <th>Owner / Department</th>
              <th class="text-center">Target Date</th>
              <th class="text-center">Completion Date</th>
              <th class="text-center">Status</th>
              <th class="text-center">Done</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let m of measures">
              <td>{{ m.measure }}</td>
              <td>{{ m.type }}</td>
              <td>{{ m.owner }}</td>
              <td class="text-center">{{ m.targetDate }}</td>
              <td class="text-center">{{ m.completionDate || '-' }}</td>
              <td class="text-center">
                <span class="status-badge" [ngClass]="m.status === 'Completed' ? 'badge-success' : 'badge-default'">{{ m.status }}</span>
              </td>
              <td class="text-center">
                <mat-checkbox [checked]="m.done" (change)="toggleDone(m)" color="primary"></mat-checkbox>
              </td>
              <td class="text-center">
                <a matTooltip="Edit" class="action-btn-link" (click)="openMeasureDialog(m)"><i class="fa fa-edit"></i></a>
                <a matTooltip="Delete" class="action-btn-link" (click)="deleteMeasure(m)"><i class="fa fa-trash red"></i></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <label class="form-label"><b>Prevention Notes:</b></label>
        <textarea rows="3" class="form-control" placeholder="Notes on systemic improvements..." [(ngModel)]="remarks"></textarea>
      </div>
      <div class="col-12 d-flex justify-content-end mt-3">
        <button mat-raised-button color="primary" class="save-btn" (click)="save()">
          <mat-icon class="btn-icon">save</mat-icon> Save
        </button>
      </div>
    </div>
  </div>
</div>
