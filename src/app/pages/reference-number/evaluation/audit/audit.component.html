<div>
  <div class="col-lg-12 row">
    <div class="col-lg-4 col-sm-4">
      <div class="row">
        <div class="form-group">
          <label class="col-lg-12 control-label">Department : </label>
          <div class="col-lg-12">
            <input type="text" class="form-control" placeholder="Enter Department" [(ngModel)]="department" />
          </div>
        </div>
        <div class="form-group">
          <label class="col-lg-12 control-label">Responsibility : </label>
          <div class="col-lg-12">
            <input type="text" class="form-control" placeholder="Enter Responsibility" [(ngModel)]="responsibility" />
          </div>
        </div>

        <div class="form-group">
          <label class="col-lg-12 control-label">Notes : </label>
          <div class="col-lg-12">
            <textarea type="text" class="form-control" style="height: 230px" placeholder="Enter Notes" [(ngModel)]="notes"
              required></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-8 col-sm-8">
      <table matSort id="example2" class="table table-bordered table-hover">
        <thead class="tbl-head">
          <tr>
            <th class="theadcolor text-center">Yes / No</th>
            <th class="theadcolor text-center">NA</th>
            <th class="theadcolor text-center">Checklist</th>

          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of values">
            <mat-radio-group aria-label="Select an option" [(ngModel)]="item.isChecked" class="text-center"
              style="margin-left: 14px">
              <td>
                <mat-radio-button [value]="'yes'" style="margin-top: 7px"></mat-radio-button>
              </td>
              <td>
                <mat-radio-button [value]="'no'" style="margin-left: 10px; margin-top: 7px"></mat-radio-button>
              </td>
            </mat-radio-group>
            <td>NA</td>
            <td>{{ item.check }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>


  <div class="col-sm-12 btn-footer-space clearfix mt-5" style="margin-right: 30px;">
    <div class="d-flex justify-content-end gap-2 footer-actions mx-3">

      <button mat-raised-button type="button" style="color: #fff; background-color: #3262a8;" (click)="save()">
        <mat-icon>save</mat-icon> Save
      </button>

      <button mat-raised-button type="button" style="color: #fff; background-color: #3262a8;" (click)="approve()">
        <mat-icon>launch</mat-icon> Approve
      </button>

    </div>
  </div>

</div>
