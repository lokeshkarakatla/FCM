<!-- Complaint Reference Header -->
<div class="complaint-ref-header">
  <p>
    <span class="ref-label">Ref No:</span>
    <span class="ref-value">FIELD/2024/09/3</span>
    <span class="ref-label">Subject:</span>
    <span class="ref-value">Global fleet of connected vehicles</span>
  </p>
</div>

<!-- Main Layout: Content + Right Sidenav -->
<div class="complaint-container">

  <!-- Content Area -->
  <div class="complaint-content">
    <router-outlet></router-outlet>
  </div>

  <!-- Right Side Navigation -->
  <nav class="complaint-sidenav" [class.collapsed-nav]="sidenavCollapsed">

    <!-- Sidenav Toggle -->
    <div class="sidenav-header">
      <mat-icon (click)="sidenavCollapsed = !sidenavCollapsed" class="sidenav-toggle">
        {{ sidenavCollapsed ? 'menu' : 'menu_open' }}
      </mat-icon>
    </div>

    <!-- Navigation Items -->
    <ul class="sidenav-list">
      <li *ngFor="let item of navItems"
          class="sidenav-item"
          [routerLink]="['./' + item.route]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [class.active]="isActive(item.route)"
          [class.collapsed]="sidenavCollapsed"
          [matTooltip]="sidenavCollapsed ? item.label : ''"
          matTooltipPosition="left">

        <mat-icon class="sidenav-icon" [style.color]="item.iconColor">{{ item.icon }}</mat-icon>
        <span class="sidenav-label" *ngIf="!sidenavCollapsed">{{ item.label }}</span>
      </li>
    </ul>

  </nav>

</div>
