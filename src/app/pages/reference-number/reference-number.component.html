<!-- Unified Reference Header: combines title, icon, ref info in bracket, subtitle & back button into one header -->
<div class="reference-unified-header">
  <div class="header-main-content">
    <div class="header-title-bar">
      <h2 class="header-title">
        <mat-icon class="header-icon" [style.color]="currentNavItem.iconColor">{{ currentNavItem.icon }}</mat-icon>
        <span class="header-title-text">{{ currentNavItem.label }}({{ refNo }})</span>
      </h2>
    </div>
    <p class="header-subtitle" *ngIf="currentNavItem.subtitle">{{ currentNavItem.subtitle }}</p>
  </div>

  <div class="header-actions">
    <button mat-raised-button class="ref-back-btn" (click)="goBack()">
      <mat-icon class="btn-icon">arrow_back</mat-icon> Back
    </button>
  </div>
</div>

<!-- Main Layout: Content + Right Sidenav -->
<div class="complaint-container">

  <!-- Content Area -->
  <div class="complaint-content">
    <router-outlet></router-outlet>
  </div>

  <!-- Right Side Navigation -->
  <nav class="complaint-sidenav" [class.collapsed-nav]="sidenavCollapsed">

    <!-- Sidenav Toggle -->
    <div class="sidenav-header">
      <mat-icon (click)="sidenavCollapsed = !sidenavCollapsed" class="sidenav-toggle">
        {{ sidenavCollapsed ? 'menu' : 'menu_open' }}
      </mat-icon>
    </div>

    <!-- Navigation Items -->
    <ul class="sidenav-list">
      <li *ngFor="let item of navItems"
          class="sidenav-item"
          [routerLink]="['./' + item.route]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [class.active]="isActive(item.route)"
          [class.collapsed]="sidenavCollapsed"
          [matTooltip]="sidenavCollapsed ? item.label : ''"
          matTooltipPosition="left">

        <mat-icon class="sidenav-icon" [style.color]="item.iconColor">{{ item.icon }}</mat-icon>
        <span class="sidenav-label" *ngIf="!sidenavCollapsed">{{ item.label }}</span>
      </li>
    </ul>

  </nav>

</div>
