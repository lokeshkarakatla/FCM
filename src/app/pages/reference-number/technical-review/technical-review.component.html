<div class="section-wrapper mt-3">
  <div class="container-fluid px-4">
    <div class="row g-4 mt-1">
      <div class="col-md-6">
        <div class="form-card">
          <h5 class="card-section-title">Review Details</h5>
          <div class="mb-3">
            <label class="form-label"><b>Reviewed By:</b></label>
            <input type="text" class="form-control" placeholder="Enter Reviewer Name" [(ngModel)]="reviewedBy">
          </div>
          <div class="mb-3">
            <label class="form-label"><b>Review Date:</b></label>
            <input type="date" class="form-control" [(ngModel)]="reviewDate">
          </div>
          <div class="mb-3">
            <label class="form-label"><b>Defect Type:</b></label>
            <mat-select placeholder="Select Defect Type" class="form-control" [(ngModel)]="defectType">
              <mat-option value="design">Design Defect</mat-option>
              <mat-option value="manufacturing">Manufacturing Defect</mat-option>
              <mat-option value="material">Material Defect</mat-option>
              <mat-option value="assembly">Assembly Error</mat-option>
              <mat-option value="supplier">Supplier Component Failure</mat-option>
            </mat-select>
          </div>
          <div class="mb-3">
            <label class="form-label"><b>Root Cause:</b></label>
            <textarea rows="4" class="form-control" placeholder="Describe the root cause..." [(ngModel)]="rootCause"></textarea>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-card">
          <h5 class="card-section-title">Analysis & Decision</h5>
          <div class="mb-3 toggle-row">
            <label class="form-label"><b>Design Defect Identified?</b></label>
            <div class="switchToggle">
              <input type="checkbox" id="designDefect" [(ngModel)]="designDefect">
              <label for="designDefect"></label>
            </div>
          </div>
          <div class="mb-3 toggle-row">
            <label class="form-label"><b>Manufacturing Defect?</b></label>
            <div class="switchToggle">
              <input type="checkbox" id="mfgDefect" [(ngModel)]="manufacturingDefect">
              <label for="mfgDefect"></label>
            </div>
          </div>
          <div class="mb-3 toggle-row">
            <label class="form-label"><b>Supplier Component Issue?</b></label>
            <div class="switchToggle">
              <input type="checkbox" id="supplierComp" [(ngModel)]="supplierComponent">
              <label for="supplierComp"></label>
            </div>
          </div>
          <div class="mb-3 toggle-row">
            <label class="form-label"><b>Containment Required?</b></label>
            <div class="switchToggle">
              <input type="checkbox" id="containmentReq" [(ngModel)]="containmentRequired">
              <label for="containmentReq"></label>
            </div>
          </div>
          <div class="mb-3 toggle-row">
            <label class="form-label"><b>Recall Required?</b></label>
            <div class="switchToggle">
              <input type="checkbox" id="recallReq" [(ngModel)]="recallRequired">
              <label for="recallReq"></label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label"><b>Engineering Analysis:</b></label>
            <textarea rows="3" class="form-control" placeholder="Detailed engineering analysis..." [(ngModel)]="engineeringAnalysis"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label"><b>Recommendations:</b></label>
            <textarea rows="3" class="form-control" placeholder="Recommended corrective actions..." [(ngModel)]="recommendations"></textarea>
          </div>
        </div>
        <div class="text-end mt-3">
          <button mat-raised-button color="primary" class="save-btn" (click)="save()">
            <mat-icon class="btn-icon">save</mat-icon> Save
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
