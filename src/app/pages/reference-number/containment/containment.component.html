<div class="section-wrapper mt-3">
  <div class="container-fluid px-4">
    <div class="mt-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="table-title">Containment Actions</h5>
        <button mat-raised-button color="primary" class="btn-sm" (click)="openActionDialog()">
          <mat-icon class="btn-icon">add</mat-icon> Add Action
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="tbl-head">
            <tr>
              <th>Action Required</th>
              <th>Department</th>
              <th>Role</th>
              <th class="text-center">Target Date</th>
              <th class="text-center">Date Completed</th>
              <th class="text-center">Status</th>
              <th class="text-center">Done</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let a of actions">
              <td>{{ a.action }}</td>
              <td>{{ a.department || 'Production' }}</td>
              <td>{{ a.responsible }}</td>
              <td class="text-center">{{ a.targetDate }}</td>
              <td class="text-center">{{ a.completionDate || '-' }}</td>
              <td class="text-center">
                <span class="status-badge" [ngClass]="a.status === 'Completed' ? 'badge-success' : 'badge-warning'">{{
                  a.status }}</span>
              </td>
              <td class="text-center">
                <mat-checkbox [checked]="a.done" (change)="toggleDone(a)" color="primary"></mat-checkbox>
              </td>
              <td class="text-center">
                <a matTooltip="Edit" class="action-btn-link" (click)="openActionDialog(a)"><i
                    class="fa fa-edit"></i></a>
                <a matTooltip="Delete" class="action-btn-link" (click)="deleteAction(a)"><i
                    class="fa fa-trash red"></i></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <label class="form-label"><b>Remarks:</b></label>
        <textarea rows="3" class="form-control" placeholder="Containment remarks..." [(ngModel)]="remarks"></textarea>
      </div>
      <div class="col-12 d-flex justify-content-end mt-3">
        <button mat-raised-button color="primary" class="save-btn" (click)="save()">
          <mat-icon class="btn-icon">save</mat-icon> Save
        </button>
      </div>
    </div>
  </div>
</div>
