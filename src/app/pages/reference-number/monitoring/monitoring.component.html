<div class="section-wrapper mt-3">
  <div class="container-fluid px-4">
    <div class="row g-3 mt-1">
      <div class="col-md-2">
        <label class="form-label"><b>Monitoring Period:</b></label>
        <mat-select placeholder="Select Period" class="form-control" [(ngModel)]="monitoringPeriod">
          <mat-option value="1week">1 Week</mat-option>
          <mat-option value="2weeks">2 Weeks</mat-option>
          <mat-option value="1month">1 Month</mat-option>
          <mat-option value="3months">3 Months</mat-option>
          <mat-option value="6months">6 Months</mat-option>
        </mat-select>
      </div>
      <div class="col-md-2">
        <label class="form-label"><b>Start Date:</b></label>
        <input type="date" class="form-control" [(ngModel)]="startDate">
      </div>
      <div class="col-md-2">
        <label class="form-label"><b>End Date:</b></label>
        <input type="date" class="form-control" [(ngModel)]="endDate">
      </div>
      <div class="col-md-3">
        <label class="form-label"><b>Department:</b></label>
        <mat-select class="form-control" [(ngModel)]="department" placeholder="Select Department">
          <mat-option *ngFor="let dept of departments" [value]="dept">{{ dept }}</mat-option>
        </mat-select>
      </div>
      <div class="col-md-3">
        <label class="form-label"><b>Monitored By:</b></label>
        <mat-select class="form-control" [(ngModel)]="monitoredBy" placeholder="Select Lead / Role">
          <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
        </mat-select>
      </div>
    </div>

    <div class="mt-4">
      <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <h5 class="table-title m-0">Monitoring Records</h5>
        <div class="d-flex align-items-center gap-2">
          <!-- <span class="badge bg-white text-success border border-success px-2 py-1" style="font-size: 12px; font-weight: 600;">
            Pass: {{ getPassedCount() }}
          </span>
          <span class="badge bg-white text-danger border border-danger px-2 py-1" style="font-size: 12px; font-weight: 600;" *ngIf="getFailedCount() > 0">
            Fail: {{ getFailedCount() }}
          </span> -->
          <button mat-raised-button color="primary" class="btn-sm" (click)="openRecordDialog()">
            <mat-icon class="btn-icon">add</mat-icon> Add Record
          </button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="tbl-head">
            <tr>
              <th class="text-center" style="width: 110px;">Date</th>
              <th>Validation Summary</th>
              <th class="text-center" style="width: 110px;">Document</th>
              <th style="width: 180px;">Department</th>
              <th style="width: 170px;">Monitored By</th>
              <th class="text-center" style="width: 100px;">Status</th>
              <th class="text-center" style="width: 90px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of records">
              <td class="text-center">{{ r.date }}</td>
              <td>{{ r.summary }}</td>
              <td class="text-center">
                <a href="javascript:void(0)" class="doc-view-link" (click)="viewDocument(r)" [matTooltip]="r.documentName ? ('View ' + r.documentName) : 'View Document'">
                  <mat-icon class="doc-view-icon">description</mat-icon>
                  <span class="doc-view-label">View</span>
                </a>
              </td>
              <td>{{ r.department || department }}</td>
              <td>{{ r.monitoredBy }}</td>
              <td class="text-center">
                <span class="status-badge" [ngClass]="r.status === 'Pass' ? 'badge-success' : 'badge-fail'">
                  {{ r.status }}
                </span>
              </td>
              <td class="text-center">
                <a matTooltip="Edit" class="action-btn-link" (click)="openRecordDialog(r)"><i class="fa fa-edit"></i></a>
                <a matTooltip="Delete" class="action-btn-link" (click)="deleteRecord(r)"><i class="fa fa-trash red"></i></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <label class="form-label"><b>Monitoring Observations:</b></label>
        <textarea rows="3" class="form-control" placeholder="Observations..." [(ngModel)]="remarks"></textarea>
      </div>
      <div class="col-12 d-flex justify-content-end mt-3">
        <button mat-raised-button color="primary" class="save-btn" (click)="save()">
          <mat-icon class="btn-icon">save</mat-icon> Save
        </button>
      </div>
    </div>
  </div>
</div>
