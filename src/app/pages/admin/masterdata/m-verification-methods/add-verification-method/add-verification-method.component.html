<div class="col-sm-12 p-0" style="max-width: 100%; box-sizing: border-box;">
  <div class="NewHeader">
    <h1 style="color: white; margin-top: 5px;" mat-dialog-title>
      {{ data ? 'Update' : 'Add' }} Verification Method
    </h1>
  </div>

  <div mat-dialog-content class="pt-3">
    <form [formGroup]="methodForm" class="form-horizontal">
      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Verification Method:</b> <span class="text-danger">*</span>
        </label>
        <div class="col-sm-8">
          <input type="text" class="form-control" formControlName="name" placeholder="Enter Verification Method" required>
          <div *ngIf="methodForm.get('name')?.invalid && methodForm.get('name')?.touched" class="text-danger small mt-1">
            Verification Method is required.
          </div>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Description:</b>
        </label>
        <div class="col-sm-8">
          <textarea rows="3" class="form-control" formControlName="description" placeholder="Enter Description"></textarea>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Status:</b>
        </label>
        <div class="col-sm-8">
          <mat-select class="form-control" formControlName="status">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
        </div>
      </div>
    </form>
  </div>

  <mat-dialog-actions align="end" class="px-3 pb-3">
    <button mat-raised-button color="primary" [disabled]="methodForm.invalid" (click)="save()">
      <mat-icon style="font-size: 20px;" class="mt-1">save</mat-icon>
      <span style="margin-left: 5px;">{{ data ? 'Update' : 'Save' }}</span>
    </button>
    <button mat-raised-button style="background-color: lightgray; color: red;" class="ms-2" (click)="close()">
      <mat-icon>cancel</mat-icon> Close
    </button>
  </mat-dialog-actions>
</div>
