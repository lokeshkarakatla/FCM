<div class="col-sm-12 p-0" style="max-width: 100%; box-sizing: border-box;">
  <div class="NewHeader">
    <h1 style="color: white; margin-top: 5px;" mat-dialog-title>
      {{ data ? 'Update' : 'Add' }} Job Code
    </h1>
  </div>

  <div mat-dialog-content class="pt-3">
    <form [formGroup]="jobForm" class="form-horizontal">
      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Job Code:</b> <span class="text-danger">*</span>
        </label>
        <div class="col-sm-8">
          <input type="text" class="form-control" formControlName="jobCode" placeholder="e.g. SRV-001" required autofocus>
          <div *ngIf="jobForm.get('jobCode')?.invalid && jobForm.get('jobCode')?.touched" class="text-danger small mt-1">
            Job Code is required.
          </div>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Service Name:</b> <span class="text-danger">*</span>
        </label>
        <div class="col-sm-8">
          <input type="text" class="form-control" formControlName="serviceName" placeholder="e.g. Brake System Inspection and Calibration" required>
          <div *ngIf="jobForm.get('serviceName')?.invalid && jobForm.get('serviceName')?.touched" class="text-danger small mt-1">
            Service Name is required.
          </div>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Labor Unit Rate (₹):</b> <span class="text-danger">*</span>
        </label>
        <div class="col-sm-8">
          <input type="number" min="0" class="form-control" formControlName="unitRate" placeholder="e.g. 850" required>
          <div *ngIf="jobForm.get('unitRate')?.invalid && jobForm.get('unitRate')?.touched" class="text-danger small mt-1">
            Valid Unit Rate is required.
          </div>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Description / Work Scope:</b>
        </label>
        <div class="col-sm-8">
          <textarea rows="3" class="form-control" formControlName="description" placeholder="Standard labor checklist or technical procedure description..."></textarea>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label class="control-label col-sm-4 text-end pt-1">
          <b>Status:</b>
        </label>
        <div class="col-sm-8">
          <mat-select class="form-control" formControlName="status">
            <mat-option value="Active">Active</mat-option>
            <mat-option value="Inactive">Inactive</mat-option>
          </mat-select>
        </div>
      </div>
    </form>
  </div>

  <mat-dialog-actions align="end" class="px-3 pb-3">
    <button mat-raised-button color="primary" [disabled]="jobForm.invalid" (click)="save()">
      <mat-icon style="font-size: 20px;" class="mt-1">save</mat-icon>
      <span style="margin-left: 5px;">{{ data ? 'Update' : 'Save' }}</span>
    </button>
    <button mat-raised-button style="background-color: lightgray; color: red;" class="ms-2" (click)="close()">
      <mat-icon>cancel</mat-icon> Close
    </button>
  </mat-dialog-actions>
</div>
